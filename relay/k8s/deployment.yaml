apiVersion: apps/v1
kind: Deployment
metadata:
  name: techuboard-relay
  namespace: techuboard-prod
  labels:
    app: techuboard-relay
    cost-center: techuboard-infra
    environment: production
    managed-by: argocd-finops
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: techuboard-relay
  template:
    metadata:
      labels:
        app: techuboard-relay
        cost-center: techuboard-infra
        environment: production
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - techuboard-relay
              topologyKey: "kubernetes.io/hostname"
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            preference:
              matchExpressions:
              - key: cloud.google.com/gke-spot
                operator: In
                values:
                - "true"
      tolerations:
      - key: "cloud.google.com/gke-spot"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: relay
        image: techuboard/relay-server:v4.0.0
        ports:
        - name: sync-port
          containerPort: 47804
        - name: metrics-port
          containerPort: 9090
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          tcpSocket:
            port: 47804
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 47804
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: techuboard-relay-service
  namespace: techuboard-prod
  labels:
    app: techuboard-relay
    cost-center: techuboard-infra
spec:
  type: LoadBalancer
  ports:
  - name: sync-tls
    port: 443
    targetPort: 47804
  - name: metrics
    port: 9090
    targetPort: 9090
  selector:
    app: techuboard-relay
