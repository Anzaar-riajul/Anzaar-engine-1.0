name: Multi-Platform Build & Verification Matrix

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-matrix:
    name: Build & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Repository Hygiene & Security Checks
        run: |
          python scripts/check_repository.py
          python scripts/test_repository_privacy.py

      - name: Run Penetration & Fuzzing Tests
        run: |
          python scripts/pen_test.py
