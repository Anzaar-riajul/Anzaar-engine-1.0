name: Multi-Platform Build & Verification Matrix

on:
  push:
    branches: [ main, develop, 'feat/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: Hygiene & Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Run Repository Hygiene & Security Checks
        run: |
          python scripts/check_repository.py
          python scripts/test_repository_privacy.py

      - name: Run Penetration & Fuzzing Tests
        run: |
          python scripts/pen_test.py
