name: Build Techuboard Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Techuboard APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & Dart Version
        run: flutter --version

      - name: Install dependencies
        working-directory: techuboard_android
        run: flutter pub get

      - name: Build Release APK
        working-directory: techuboard_android
        run: |
          set -o pipefail
          flutter build apk --release --android-skip-build-dependency-validation -v 2>&1 | tee /tmp/flutter_build.log

      - name: Push Error Log to Repo on Failure
        if: failure()
        run: |
          tail -n 500 /tmp/flutter_build.log > error_log.txt
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add error_log.txt
          git commit -m "ci: capture exact build failure log (500 lines)" || true
          git push || true

      - name: Rename APK for release
        run: cp techuboard_android/build/app/outputs/flutter-apk/app-release.apk Techuboard-Android-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techuboard-Android-v1.0
          path: Techuboard-Android-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Techuboard Android v1.0 (Build ${{ github.run_number }})
          body: |
            ## Techuboard Android System-Wide Keyboard APK
            - **TechuAvro Phonetic Keyboard** with instant transliteration
            - **Native InputMethodService** integration
            - **Voice-to-Text** and **D-Pad Cursor Console**
            
            Download `Techuboard-Android-v1.0.apk` below and install directly onto your Android device!
          files: |
            Techuboard-Android-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
