name: Build Techuboard Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Techuboard APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & Dart Version
        run: flutter --version

      - name: Install dependencies
        working-directory: techuboard_android
        run: flutter pub get

      - name: Build Release APK
        working-directory: techuboard_android
        env:
          TECHUBOARD_ALLOW_DEBUG_SIGNING: "1"
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techuboard-Android-v1.0
          path: techuboard_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Techuboard Android v1.0 (Build ${{ github.run_number }})
          body: |
            ## Techuboard Android System-Wide Keyboard APK
            - **TechuAvro Phonetic Keyboard** with instant transliteration
            - **Native InputMethodService** integration
            - **Voice-to-Text** and **D-Pad Cursor Console**
            
            Download `Techuboard-Android-v1.0.apk` below and install directly onto your Android device!
          files: |
            techuboard_android/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
