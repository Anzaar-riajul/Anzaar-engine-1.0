name: Build Techuboard Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Techuboard Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Read pinned Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Build Android Release APK
        working-directory: techuboard_android
        run: |
          flutter pub get
          flutter build apk --release

      - name: Locate and Prepare Release APK
        run: |
          mkdir -p dist
          APK_PATH=$(find techuboard_android/build/app/outputs/flutter-apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find techuboard_android/build/app/outputs -name "*.apk" | grep -v "unaligned" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found!"
            find techuboard_android/build -maxdepth 5
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/Techuboard-Android-v1.0.apk
          ls -lh dist/Techuboard-Android-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techuboard-Android-v1.0
          path: dist/Techuboard-Android-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: android-v1.0-${{ github.run_number }}
          name: Techuboard Android v1.0 (Build ${{ github.run_number }})
          body: |
            ## 🎉 Techuboard Complete Android App v1.0
            ### 🚀 Features:
            - **Floating Paste Hub**: Global draggable overlay with 1-tap direct paste injection
            - **My Notes**: Complete cross-device synchronized notes and folders
            - **Auto Image & File Sync**: Real-time clipboard, photo, and file streaming
            - **Multi-Device Mesh Sync**: Auto discovery and seamless syncing between Mac, Android, and Windows
            - **Privacy First**: 100% end-to-end encrypted, zero tracking
          files: |
            dist/Techuboard-Android-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
