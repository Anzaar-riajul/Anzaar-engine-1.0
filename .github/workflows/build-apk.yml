name: Build Techuboard Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Techuboard Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses 2>/dev/null || true

      - name: Flutter Dependencies
        working-directory: techuboard_android
        run: |
          flutter pub get

      - name: Build Techuboard Android Release APK
        working-directory: techuboard_android
        run: |
          flutter build apk --release --verbose 2>&1 | tee /tmp/flutter_build.log

      - name: Capture Failure Log If Any
        if: failure()
        run: |
          echo "### ⚠️ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 250 /tmp/flutter_build.log 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No build log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Locate and Prepare Release APK
        run: |
          mkdir -p dist
          echo "=== Searching for Release APK ==="
          find . -name "*.apk" -ls || true
          APK_PATH=$(find . -name "*release*.apk" 2>/dev/null | grep -v "unaligned" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" 2>/dev/null | grep -v "unaligned" | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/Techuboard-Android-v1.0.apk
          ls -lh dist/Techuboard-Android-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techuboard-Android-v1.0
          path: dist/Techuboard-Android-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: android-v1.0-${{ github.run_number }}
          name: Techuboard Android v1.0 (Build ${{ github.run_number }})
          body: |
            ## 🎉 Techuboard Android Clipboard Companion v1.0
            ### 🚀 Features:
            - **Real-time Clipboard Sync**: Sync clips instantly between Mac and Android
            - **Floating Paste Hub**: Floating bubble to paste clips directly anywhere
            - **My Notes & Folders**: Notes synced across devices
            - **LAN Mesh Device Sync**: 100% offline local encrypted sync with your Mac
            - **Zero Tracking**: 100% private, no cloud dependencies
          files: |
            dist/Techuboard-Android-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
