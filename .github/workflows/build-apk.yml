name: Build Techuboard Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Pure Native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Native Android APK with Gradle
        working-directory: native_android/TechuboardKeyboard
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Prepare Release APK
        run: |
          mkdir -p dist
          APK_PATH=$(find native_android/TechuboardKeyboard/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found!"
            find native_android/TechuboardKeyboard/app/build -maxdepth 5
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/Techuboard-Android-v1.0.apk
          ls -lh dist/Techuboard-Android-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techuboard-Android-v1.0
          path: dist/Techuboard-Android-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: native-v1.0-${{ github.run_number }}
          name: Techuboard Native Android v1.0 (Build ${{ github.run_number }})
          body: |
            ## 🎉 Techuboard Pure Native Android Keyboard APK

            ### 🚀 Features:
            - **100% Pure Native Kotlin IME**: Fast, lightweight, zero-bloat.
            - **TechuAvro Phonetic Engine**: Instant Avro transliteration into Bengali script.
            - **Instant Toggle**: Seamless 1-tap switch between TechuAvro and English modes.
            - **Integrated Clipboard Bar**: 1-tap pasting directly from the keyboard candidate bar.
            - **Spacebar Cursor Control**: Swipe left/right across the spacebar to glide the cursor precisely.
            - **Modern Dark UI**: Designed for Android 7.0 to Android 14+.

            ### 📲 Quick Install Guide:
            1. Download `Techuboard-Android-v1.0.apk` below and install it on your Android phone.
            2. Open the Techuboard app and tap **"১. কীবোর্ড সক্রিয় করুন (Enable in Settings)"**.
            3. Tap **"২. Techuboard নির্বাচন করুন (Select Input Method)"** and choose Techuboard.
            4. Type anywhere in WhatsApp, Messenger, Facebook, Chrome, etc.!
          files: |
            dist/Techuboard-Android-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
