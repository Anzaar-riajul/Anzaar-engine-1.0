name: Build Techuboard Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Techuboard Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Techuboard Native Android APK
        working-directory: native_android/TechuboardKeyboard
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and Prepare Release APK
        run: |
          mkdir -p dist
          APK_PATH=$(find native_android/TechuboardKeyboard/app/build/outputs/apk -name "*release*.apk" 2>/dev/null | grep -v "unaligned" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            APK_PATH=$(find native_android/TechuboardKeyboard/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Release APK not found!"
            find native_android/TechuboardKeyboard/app/build -maxdepth 5
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" dist/Techuboard-Android-v1.0.apk
          ls -lh dist/Techuboard-Android-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techuboard-Android-v1.0
          path: dist/Techuboard-Android-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          tag_name: android-v1.0-${{ github.run_number }}
          name: Techuboard Android v1.0 (Build ${{ github.run_number }})
          body: |
            ## 🎉 Techuboard Android App v1.0
            ### 🚀 Features:
            - **Native Avro Phonetic Engine**: Real-time Bangla transliteration (e.g. `ami` → `আমি`, `bangla` → `বাংলা`)
            - **Instant Bangla/English Switch**: 1-tap quick toggle between Bengali and English
            - **Quick Clipboard Bar**: 1-tap pasting from recent clipboard history directly above keyboard
            - **Spacebar Cursor Glide**: Swipe left/right on spacebar for smooth cursor positioning
            - **Modern Liquid Glass UI**: Optimized for Android 7.0 through Android 15
          files: |
            dist/Techuboard-Android-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
