name: Build Techuboard Android APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Techuboard Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses 2>/dev/null || true

      - name: Flutter Dependencies
        working-directory: techuboard_android
        run: |
          flutter pub get

      - name: Build Techuboard Android Release APK
        working-directory: techuboard_android
        run: |
          flutter build apk --release
          mkdir -p ../dist
          echo "=== Built APK files ==="
          find build -type f -name "*.apk" -ls
          
          # Copy release APK to dist
          APK_FILE=$(find build/app/outputs -type f -name "*release*.apk" | grep -v "unaligned" | head -n 1)
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            APK_FILE=$(find build -type f -name "*.apk" | grep -v "unaligned" | head -n 1)
          fi
          
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Release APK was not found in build directory!"
            exit 1
          fi
          
          echo "Found release APK: $APK_FILE"
          cp "$APK_FILE" ../dist/Techuboard-Android-v1.0.apk
          ls -lh ../dist/Techuboard-Android-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Techuboard-Android-v1.0
          path: dist/Techuboard-Android-v1.0.apk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/feat/')
        continue-on-error: true
        with:
          tag_name: android-v1.0-${{ github.run_number }}
          name: Techuboard Android v1.0 (Build ${{ github.run_number }})
          body: |
            ## 🎉 Techuboard Android Clipboard Companion v1.0
            ### 🚀 Features:
            - **Real-time Clipboard Sync**: Sync clips instantly between Mac and Android
            - **Floating Paste Hub**: Floating bubble to paste clips directly anywhere
            - **My Notes & Folders**: Notes synced across devices
            - **LAN Mesh Device Sync**: 100% offline local encrypted sync with your Mac
            - **Zero Tracking**: 100% private, no cloud dependencies
          files: |
            dist/Techuboard-Android-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
